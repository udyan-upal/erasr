name: Bug report
description: Report a reproducible problem with erasr.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first and make sure you are using the latest version from `main`.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
      placeholder: When I search for..., erasr...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps so the issue can be reproduced.
      placeholder: |
        1. Open the extension
        2. Search for ...
        3. Click ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: Found at `chrome://version`.
      placeholder: "e.g. 142.0.7444.60"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15.6, Windows 11, Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install erasr?
      options:
        - Cloned the repository
        - Downloaded the ZIP
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Screenshots, console output, or additional context
      description: |
        To open the extension console, right-click inside the extension page, choose **Inspect**, and open the **Console** tab. Remove any sensitive browsing history before posting.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am using the latest version from `main`.
          required: true
