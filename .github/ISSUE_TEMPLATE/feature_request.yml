name: Feature request
description: Suggest an improvement or new capability for erasr.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please search existing issues first and keep erasr's local-first, minimal-permission design in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or limitation you are running into.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like erasr to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have tried.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be implemented without collecting data or making network requests.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
